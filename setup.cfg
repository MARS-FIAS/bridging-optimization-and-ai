[metadata]
name = bridging-optimization-and-ai
version = 0.5.0
description = Spatial stochastic blastocyst modeling and goal-conditioned neural inference
long_description = file: README.md
long_description_content_type = text/markdown
author = Michael Alexander Ramirez Sierra and Thomas R. Sokolowski
url = https://github.com/MARS-FIAS/bridging-optimization-and-ai
license = MIT
license_files =
    LICENSE
    licenses/*.txt

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8,<3.9
install_requires =
    numpy==1.24.3
    scipy==1.10.1
    numba==0.58.1

[options.packages.find]
where = src

[options.extras_require]
inference =
    torch==1.11.0
    sbi==0.19.2
    nflows==0.14
    pyknos==0.15.1
    pyro-ppl==1.8.1
    matplotlib==3.6.2
plots =
    matplotlib==3.6.2

[options.entry_points]
console_scripts =
    cavity-sbi = cavity_sbi.cli:main
