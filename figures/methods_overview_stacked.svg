    <text x="330.0" y="110" text-anchor="middle" font-size="38" font-weight="700">biological objective</text>
    <text x="330.0" y="152" text-anchor="middle" font-size="24" fill="#526777">A review of calibration methods</text>
    <text x="330.0" y="184" text-anchor="middle" font-size="24" fill="#526777">for spatial stochastic systems</text>
