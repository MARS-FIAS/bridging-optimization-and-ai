  <title id="title">Agreement of meta-score selection policies</title>
  <desc id="desc">Computed retrospective comparison for eight geometries and five inference rounds. Each cell shows whether the S-selected first task also maximizes R25: same first task (34 groups, equals sign), a different first task with a tie (2 groups, tie), or a higher R25 available from another retained candidate, with the gain printed in the cell (4 groups: +0.1375, +0.0813, +0.0103, +0.0143). The S-selected candidate also maximizes R25 in 36 of 40 groups (90%), including all eight final rounds.</desc>
