<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="708" viewBox="0 0 1320 708" role="img" aria-labelledby="title description">
  <title id="title">Three roles for a biological objective in parameter calibration</title>
  <desc id="description">A conceptual comparison of direct optimization, optimization priors and neural simulation-based inference. Direct optimization searches for parameter sets, optimization priors weight a prior by utility before updating with observations, and neural inference learns a conditional parameter density. The repository illustrates the neural approach with a biological target.</desc>
