<svg xmlns="http://www.w3.org/2000/svg" width="372.6pt" height="272.25pt" viewBox="0 0 372.6 272.25" role="img" aria-labelledby="title desc" font-family="'STIX Two Text','STIX Two Math','Times New Roman',serif" text-rendering="geometricPrecision">
  <title id="title">Eight fixed ICM geometries (schematic model inputs)</title>
  <desc id="desc">Schematic of the eight fixed ICM geometries used as model inputs: compact geometries (1,1), (2,2), (3,3), (4,4) and (5,5) with 2, 4, 6, 8 and 10 cells, and pyramidal geometries (5,3,1), (7,5,3,1) and (9,7,5,3,1) with 9, 16 and 25 cells. All cells are fate-neutral and of equal size; the bottom row is the cavity-adjacent layer and the rows above are the upper ICM layers; the cavity is a schematic extracellular reservoir.</desc>
